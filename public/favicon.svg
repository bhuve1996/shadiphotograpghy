<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4dc"/>
      <stop offset="40%" stop-color="#dfba73"/>
      <stop offset="70%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#9a7632"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1810"/>
      <stop offset="100%" stop-color="#0b0c10"/>
    </radialGradient>
  </defs>

  <!-- Background Medallion -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGlow)" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.6"/>

  <!-- Interlocking Royal Monogram H & B -->
  <g fill="none" stroke="url(#goldGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Letter H -->
    <line x1="28" y1="30" x2="28" y2="70" stroke-width="3"/>
    <line x1="42" y1="30" x2="42" y2="70" stroke-width="3"/>
    <line x1="28" y1="49" x2="42" y2="49" stroke-width="2.5"/>

    <!-- Central Ampersand or Ring Link Motif -->
    <circle cx="49" cy="49" r="6" stroke-width="1.8" fill="#14110b"/>

    <!-- Letter B -->
    <path d="M 56 30 L 56 70" stroke-width="3"/>
    <path d="M 56 30 Q 72 30 72 48 Q 72 50 56 50" stroke-width="2.5"/>
    <path d="M 56 50 Q 74 50 74 70 L 56 70" stroke-width="2.5"/>
  </g>

  <!-- Sparkle Diamond at Top -->
  <polygon points="50,15 52,20 57,22 52,24 50,29 48,24 43,22 48,20" fill="url(#goldGrad)"/>
</svg>
